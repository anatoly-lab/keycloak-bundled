---
# Build & push the custom Keycloak image (Keycloak + Herdo remember-me SPI).
#
# See CLAUDE.md and the project brief for the why. This workflow produces a
# reproducible OCI image, pushes it to GHCR under multiple tags, then runs a
# pair of downstream verification jobs (boot smoke test + Testcontainers
# integration tests). On `v*` tag pushes, a final `release` job promotes the
# already-verified immutable SHA tag to the human-readable semver tag and
# publishes a GitHub Release -- only after smoke + integration tests pass.
#
# Triggers:
#   - push to main      -> rebuild on every merge
#   - tag push v*       -> release builds (concurrency does NOT cancel these)
#   - workflow_dispatch -> manual rebuild, optional KC/plugin overrides
#
# Registry auth:
#   Uses GITHUB_TOKEN (auto-provisioned per-job) with `packages: write` to push
#   to ghcr.io under the owning user/org's namespace. No PAT required.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      kc_version:
        description: 'Keycloak version (must match the Keycloak Operator version deployed by the consuming Kubernetes manifest)'
        required: false
        default: '26.7.2'
      plugin_git_sha:
        description: 'Upstream Herdo/keycloak-remember-me-authenticator commit, for the OCI label'
        required: false
        default: 'de35b36'

# Least-privilege at the workflow level. Individual jobs narrow further where
# they can (smoke-test and integration-test only need to *pull* from GHCR, and
# the release job needs `contents: write` + `packages: write` to create the
# Release and promote the verified image tag on tag push).
permissions:
  contents: read
  packages: write

# Cancel in-progress builds on main when a newer push lands (saves CI minutes
# on rapid-succession merges). Do NOT cancel tag builds -- a v* tag push is a
# release artifact and must complete even if main is moving.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/keycloak-bundled
  # Fallback defaults for non-dispatch triggers. Keep in sync with the
  # workflow_dispatch input defaults above.
  DEFAULT_KC_VERSION: '26.7.2'
  DEFAULT_PLUGIN_GIT_SHA: 'de35b36'

jobs:
  lint:
    name: Lint (Dockerfile + workflow files)
    runs-on: ubuntu-latest
    # Runs on every trigger, including pull_request -- both build-and-push
    # (push/dispatch/tag) and pr-build (pull_request) depend on this job.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        # Pinned to a specific patch -- hadolint-action doesn't publish a
        # floating `v3` tag (verified against the GitHub Releases API).
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ./Dockerfile

      - name: Lint workflow files (actionlint)
        # raven-actions/actionlint is the conventional wrapper around rhysd's
        # actionlint CLI. The rhysd/actionlint repo itself is a Go CLI with no
        # action.yml, so a wrapper is required if we want `uses:` semantics.
        # Pinned to a specific patch -- raven-actions/actionlint doesn't
        # publish a floating `v2` tag either.
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: lint
    # PRs (from Dependabot or anyone else) never push to GHCR -- see the
    # `pr-build` job below, which builds the image without registry access.
    if: github.event_name != 'pull_request'

    # Job-level outputs surface the immutable image tag (and a few inputs) to
    # downstream jobs. `smoke-test` and `integration-test` both pull by the
    # SHA-suffixed tag because it is the only tag guaranteed to identify *this
    # exact build* -- `latest` and the per-day tag can race with a parallel run.
    # On `v*` tag pushes we also expose the stripped semver so the release job
    # can promote the verified image to it without recomputing.
    outputs:
      image_tag_sha: ${{ steps.meta.outputs.image_tag_sha }}
      image_ref_sha: ${{ steps.meta.outputs.image_ref_sha }}
      kc_version: ${{ steps.meta.outputs.kc_version }}
      plugin_git_sha: ${{ steps.meta.outputs.plugin_git_sha }}
      release_version: ${{ steps.meta.outputs.release_version }}

    # Permission notes for this job:
    #   contents: read  -- only need source checkout; Release creation moved to
    #     the `release` job which holds `contents: write`.
    #   packages: write -- push to GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        # v6 is a Node 24 runtime bump (no input/output changes affecting our
        # usage). ubuntu-latest ships runner >= v2.327.1, which satisfies the
        # Node 24 requirement.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build metadata
        id: meta
        # User-supplied dispatch inputs are exposed via env (not inline ${{ }})
        # so the shell never sees them as code -- see
        # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
        env:
          INPUT_KC_VERSION: ${{ github.event.inputs.kc_version }}
          INPUT_PLUGIN_GIT_SHA: ${{ github.event.inputs.plugin_git_sha }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Inputs take precedence on workflow_dispatch; otherwise use env defaults.
          KC_VERSION="${INPUT_KC_VERSION:-${DEFAULT_KC_VERSION}}"
          PLUGIN_GIT_SHA="${INPUT_PLUGIN_GIT_SHA:-${DEFAULT_PLUGIN_GIT_SHA}}"
          VCS_REF="${GH_SHA}"
          VCS_REF_SHORT="${VCS_REF:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DATE_TAG="$(date -u +%Y.%m.%d)"

          IMAGE_TAG_SHA="${KC_VERSION}-${DATE_TAG}-${VCS_REF_SHORT}"
          IMAGE_REF_SHA="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG_SHA}"

          # On a `v*` tag push, expose the v-stripped form (e.g. `v1.0.0` ->
          # `1.0.0`) so the release job can promote the verified immutable
          # image to it. Empty otherwise; the release job's `if:` guards on
          # `startsWith(github.ref, 'refs/tags/v')` regardless.
          RELEASE_VERSION=""
          if [[ "${GH_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GH_REF#refs/tags/v}"
          fi

          {
            echo "kc_version=${KC_VERSION}"
            echo "plugin_git_sha=${PLUGIN_GIT_SHA}"
            echo "vcs_ref=${VCS_REF}"
            echo "vcs_ref_short=${VCS_REF_SHORT}"
            echo "build_date=${BUILD_DATE}"
            echo "date_tag=${DATE_TAG}"
            echo "image_tag_sha=${IMAGE_TAG_SHA}"
            echo "image_ref_sha=${IMAGE_REF_SHA}"
            echo "release_version=${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved KC_VERSION=${KC_VERSION}"
          echo "Resolved PLUGIN_GIT_SHA=${PLUGIN_GIT_SHA}"
          echo "Resolved VCS_REF_SHORT=${VCS_REF_SHORT}"
          echo "Resolved BUILD_DATE=${BUILD_DATE}"
          echo "Resolved DATE_TAG=${DATE_TAG}"
          echo "Resolved IMAGE_TAG_SHA=${IMAGE_TAG_SHA}"
          echo "Resolved RELEASE_VERSION=${RELEASE_VERSION:-<none>}"

      - name: Assert KC_VERSION matches the plugin's Keycloak BOM
        # src/pom.xml's <version.keycloak> pins the BOM the plugin is compiled
        # against; the runtime base image is quay.io/keycloak/keycloak:${KC_VERSION}
        # from the step above. These two MUST agree -- a workflow_dispatch
        # override of kc_version without a matching pom.xml bump would ship a
        # plugin JAR built against the wrong BOM into a differently-versioned
        # Keycloak base, which is exactly the drift this repo's vendoring
        # strategy exists to prevent (see CLAUDE.md).
        env:
          KC_VERSION: ${{ steps.meta.outputs.kc_version }}
        run: |
          set -euo pipefail
          POM_KC_VERSION="$(sed -n 's:.*<version\.keycloak>\(.*\)</version\.keycloak>.*:\1:p' src/pom.xml | head -1)"
          if [[ -z "${POM_KC_VERSION}" ]]; then
            echo "::error::<version.keycloak> not found in src/pom.xml"
            exit 1
          fi
          if [[ "${POM_KC_VERSION}" != "${KC_VERSION}" ]]; then
            echo "::error::KC_VERSION (${KC_VERSION}) does not match src/pom.xml <version.keycloak> (${POM_KC_VERSION})."
            echo "::error::Bump src/pom.xml's <version.keycloak> to match, or correct the kc_version input."
            exit 1
          fi
          echo "OK: KC_VERSION (${KC_VERSION}) matches src/pom.xml <version.keycloak>."

          DOCKERFILE_KC_VERSION="$(sed -n 's/^ARG KC_VERSION=\(.*\)$/\1/p' Dockerfile | head -1)"
          if [[ -z "${DOCKERFILE_KC_VERSION}" ]]; then
            echo "::error::ARG KC_VERSION= not found in Dockerfile"
            exit 1
          fi
          if [[ "${DOCKERFILE_KC_VERSION}" != "${KC_VERSION}" ]]; then
            echo "::error::KC_VERSION (${KC_VERSION}) does not match Dockerfile's ARG KC_VERSION= default (${DOCKERFILE_KC_VERSION})."
            echo "::error::Bump the Dockerfile's ARG KC_VERSION= default to match, or correct the kc_version input."
            exit 1
          fi
          echo "OK: KC_VERSION (${KC_VERSION}) matches Dockerfile's ARG KC_VERSION= default."

      - name: Set up QEMU
        # v4 is a Node 24 runtime bump only; no input changes.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        # v4 is a Node 24 runtime bump; removed the deprecated `install:` input
        # (we don't use it). Our parameterless usage is unaffected.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        # v4 is a Node 24 runtime bump; inputs unchanged.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # v7 is a Node 24 runtime bump; removed deprecated
        # DOCKER_BUILD_NO_SUMMARY / DOCKER_BUILD_EXPORT_RETENTION_DAYS envs --
        # we don't set them, so no workflow-side change required.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Multi-arch: arm64 is QEMU-emulated on the GitHub amd64 runner, which
          # adds ~5-10 minutes to the Maven and `kc.sh build` phases. The
          # cluster supports both archs (staging runs on Apple Silicon under
          # QEMU), so we publish a manifest list covering both.
          platforms: linux/amd64,linux/arm64
          build-args: |
            KC_VERSION=${{ steps.meta.outputs.kc_version }}
            PLUGIN_GIT_SHA=${{ steps.meta.outputs.plugin_git_sha }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM (CycloneDX/SPDX) and max-mode provenance attestation. Both
          # land in the registry alongside the manifest and surface on the
          # ghcr.io package page for supply-chain inspection.
          sbom: true
          provenance: mode=max
          # Three tags on every build:
          #   - immutable SHA tag (referenced by downstream test jobs)
          #   - floating per-day tag
          #   - :latest
          # The human-readable `<release_version>` tag for v* pushes is NOT
          # published here -- it is promoted by the `release` job only after
          # smoke-test + integration-test pass. This prevents a failed build
          # from ever holding a public semver tag.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.kc_version }}-${{ steps.meta.outputs.date_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  pr-build:
    name: PR build (no push)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    # PRs (Dependabot or otherwise) get lint + a full image build to catch
    # BOM/base/action breakage; no push, no registry access.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert KC_VERSION matches the plugin's Keycloak BOM
        # src/pom.xml's <version.keycloak> pins the BOM the plugin is compiled
        # against; the runtime base image is quay.io/keycloak/keycloak:${KC_VERSION}
        # resolved from DEFAULT_KC_VERSION in this job. These two MUST agree -- a workflow_dispatch
        # override of kc_version without a matching pom.xml bump would ship a
        # plugin JAR built against the wrong BOM into a differently-versioned
        # Keycloak base, which is exactly the drift this repo's vendoring
        # strategy exists to prevent (see CLAUDE.md).
        env:
          KC_VERSION: ${{ env.DEFAULT_KC_VERSION }}
        run: |
          set -euo pipefail
          POM_KC_VERSION="$(sed -n 's:.*<version\.keycloak>\(.*\)</version\.keycloak>.*:\1:p' src/pom.xml | head -1)"
          if [[ -z "${POM_KC_VERSION}" ]]; then
            echo "::error::<version.keycloak> not found in src/pom.xml"
            exit 1
          fi
          if [[ "${POM_KC_VERSION}" != "${KC_VERSION}" ]]; then
            echo "::error::KC_VERSION (${KC_VERSION}) does not match src/pom.xml <version.keycloak> (${POM_KC_VERSION})."
            echo "::error::Bump src/pom.xml's <version.keycloak> to match, or correct the kc_version input."
            exit 1
          fi
          echo "OK: KC_VERSION (${KC_VERSION}) matches src/pom.xml <version.keycloak>."

          DOCKERFILE_KC_VERSION="$(sed -n 's/^ARG KC_VERSION=\(.*\)$/\1/p' Dockerfile | head -1)"
          if [[ -z "${DOCKERFILE_KC_VERSION}" ]]; then
            echo "::error::ARG KC_VERSION= not found in Dockerfile"
            exit 1
          fi
          if [[ "${DOCKERFILE_KC_VERSION}" != "${KC_VERSION}" ]]; then
            echo "::error::KC_VERSION (${KC_VERSION}) does not match Dockerfile's ARG KC_VERSION= default (${DOCKERFILE_KC_VERSION})."
            echo "::error::Bump the Dockerfile's ARG KC_VERSION= default to match, or correct the kc_version input."
            exit 1
          fi
          echo "OK: KC_VERSION (${KC_VERSION}) matches Dockerfile's ARG KC_VERSION= default."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          build-args: |
            KC_VERSION=${{ env.DEFAULT_KC_VERSION }}
            PLUGIN_GIT_SHA=${{ env.DEFAULT_PLUGIN_GIT_SHA }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=unknown
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test (boot + provider registration)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    # Read-only at the registry: we are pulling our own freshly-pushed image
    # back down to assert the container actually boots and the SPI is wired.
    permissions:
      contents: read
      packages: read

    env:
      IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref_sha }}

    steps:
      - name: Log in to GitHub Container Registry (pull)
        # Even though GITHUB_TOKEN has `packages: read` on this job, docker
        # still needs a credentials helper entry to pull from ghcr.io for
        # private packages. For public packages this is a no-op; keeping the
        # step makes the workflow forward-compatible if the package is later
        # set private.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (linux/amd64)
        run: |
          set -euo pipefail
          echo "Pulling ${IMAGE_REF} (linux/amd64)"
          # Multi-arch manifest -- explicitly request amd64 to avoid the
          # runner accidentally fetching an arm64 layer it can't execute.
          docker pull --platform linux/amd64 "${IMAGE_REF}"

      - name: Start container (start-dev, no DB)
        # `start --optimized` requires a configured DB and hostname. For a
        # boot smoke test we only need the server to come up and answer the
        # admin API, so `start-dev` (which uses the in-memory dev DB and
        # disables strict hostname checks) is the right call. The Dockerfile
        # comment already calls this out as the smoke-testing path.
        run: |
          set -euo pipefail
          docker run -d --name kc-smoke \
            --platform linux/amd64 \
            -p 8080:8080 \
            -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HEALTH_ENABLED=true \
            "${IMAGE_REF}" \
            start-dev
          echo "Container started:"
          docker ps --filter name=kc-smoke

      - name: Wait for /health/ready (max 120s)
        run: |
          set -euo pipefail
          # 9000 is Keycloak's management interface (KC_HTTP_MANAGEMENT_PORT).
          # /health/ready returns 200 once Quarkus has finished augmentation
          # and the realm bootstrap is complete. Earlier responses (503/404)
          # are normal during boot.
          for i in $(seq 1 60); do
            if curl --silent --fail --output /dev/null \
                 --max-time 5 http://localhost:9000/health/ready; then
              echo "Keycloak ready after ${i} attempts (~$((i * 2))s)"
              exit 0
            fi
            echo "Attempt ${i}/60: not ready yet, sleeping 2s"
            sleep 2
          done
          echo "::error::Keycloak failed to reach /health/ready within 120s"
          echo "----- docker ps -----"
          docker ps -a
          echo "----- container logs (tail 200) -----"
          docker logs --tail 200 kc-smoke || true
          exit 1

      - name: Assert remember-me-authenticator provider is registered
        # Critical assertion: the whole point of this image is the SPI plugin.
        # Boot success alone doesn't prove it -- `kc.sh build` succeeded at
        # image-build time, but a packaging regression could still ship the
        # JAR without registering the factory. We hit the admin API to be
        # sure.
        run: |
          set -euo pipefail

          echo "Requesting admin token from master realm"
          TOKEN_JSON="$(
            curl --silent --fail --show-error --max-time 10 \
              -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -d 'grant_type=password' \
              -d 'client_id=admin-cli' \
              -d 'username=admin' \
              -d 'password=admin'
          )"
          ACCESS_TOKEN="$(echo "${TOKEN_JSON}" | jq -r '.access_token')"
          if [[ -z "${ACCESS_TOKEN}" || "${ACCESS_TOKEN}" == "null" ]]; then
            echo "::error::Failed to obtain admin token. Response:"
            echo "${TOKEN_JSON}"
            exit 1
          fi
          echo "Admin token acquired (length=${#ACCESS_TOKEN})"

          echo "Listing authenticator providers"
          PROVIDERS_JSON="$(
            curl --silent --fail --show-error --max-time 10 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              http://localhost:8080/admin/realms/master/authentication/authenticator-providers
          )"

          # Provider ID confirmed from
          # src/src/main/java/.../RememberMeAuthenticatorFactory.java:
          #     public static final String PROVIDER_ID = "remember-me-authenticator";
          if echo "${PROVIDERS_JSON}" | jq -e '.[] | select(.id == "remember-me-authenticator")' >/dev/null; then
            echo "OK: remember-me-authenticator provider is registered:"
            echo "${PROVIDERS_JSON}" | jq '.[] | select(.id == "remember-me-authenticator")'
          else
            echo "::error::remember-me-authenticator NOT found in authenticator-providers response."
            echo "Full provider list:"
            echo "${PROVIDERS_JSON}" | jq '.[].id' || echo "${PROVIDERS_JSON}"
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "----- docker logs kc-smoke -----"
          docker logs kc-smoke || true

      - name: Stop and remove container
        if: always()
        run: |
          docker stop kc-smoke || true
          docker rm   kc-smoke || true

  smoke-test-optimized:
    name: Smoke test (start --optimized with Postgres)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    # The reason this job exists: `start-dev` re-runs `kc.sh build` on every
    # boot, so it tolerates a Dockerfile that bakes too few build-time options
    # into the image. The Operator's production path uses `start --optimized`,
    # which does NOT rebuild and instead fails with "build time options that
    # differ from what is persisted" if KC_DB / KC_HEALTH_ENABLED /
    # KC_METRICS_ENABLED (or any other build option) is set at runtime to a
    # value that wasn't passed to `kc.sh build` at image-build time. The
    # regression that motivated this job: keycloak-bundled:1.0.1 baked none of
    # those, so the Operator deployment exited on startup with a one-line
    # warning. See Dockerfile stage 2 comments for the matching contract.

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref_sha }}

    # Services are accessible from the runner host as localhost:<mapped-port>,
    # and from a container started with --network host as 127.0.0.1:<port>.
    # Pinning to postgres:16 matches Keycloak 26's supported DB matrix.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: keycloak
          POSTGRES_USER: keycloak
          POSTGRES_PASSWORD: kcpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycloak -d keycloak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Log in to GitHub Container Registry (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (linux/amd64)
        run: |
          set -euo pipefail
          echo "Pulling ${IMAGE_REF} (linux/amd64)"
          docker pull --platform linux/amd64 "${IMAGE_REF}"

      - name: Generate ephemeral self-signed TLS cert
        # `start --optimized` refuses to boot with HTTPS disabled and no TLS
        # material. We can't bake `--http-enabled=true` into the image because
        # the production Operator deployment runs HTTPS-internal (its "build
        # time options differ" warning only flagged db/health/metrics, NOT
        # http-enabled -- so http-enabled=false already matches production).
        # Generate a throwaway cert here instead; this mirrors what the
        # Operator's TLS secret provides at runtime.
        # Mode 644 because the Keycloak container runs as uid 1000 and needs
        # to read both files; a test cert key has no real secrecy value.
        run: |
          set -euo pipefail
          mkdir -p /tmp/kc-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/kc-tls/tls.key \
            -out /tmp/kc-tls/tls.crt \
            -subj "/CN=localhost"
          chmod 644 /tmp/kc-tls/tls.key /tmp/kc-tls/tls.crt
          ls -l /tmp/kc-tls/

      - name: Start container (start --optimized)
        # --network host so the kc container can reach the postgres service on
        # 127.0.0.1:5432 (services are bound to the runner host's network).
        # No -p flags needed: host networking exposes container ports directly.
        # KC_HOSTNAME_STRICT=false because we're booting under an arbitrary
        # localhost address; the Operator deployment sets a real hostname.
        # KC_HTTPS_CERTIFICATE_FILE / _KEY_FILE point at the throwaway cert
        # generated above. These are runtime options (not build-time), so
        # setting them here doesn't constitute the contract this test is
        # designed to catch.
        run: |
          set -euo pipefail
          docker run -d --name kc-opt \
            --platform linux/amd64 \
            --network host \
            -v /tmp/kc-tls:/etc/x509/https:ro \
            -e KC_DB_URL_HOST=127.0.0.1 \
            -e KC_DB_URL_DATABASE=keycloak \
            -e KC_DB_USERNAME=keycloak \
            -e KC_DB_PASSWORD=kcpass \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HTTPS_CERTIFICATE_FILE=/etc/x509/https/tls.crt \
            -e KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/x509/https/tls.key \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            "${IMAGE_REF}" \
            start --optimized
          echo "Container started:"
          docker ps --filter name=kc-opt

      - name: Wait for /health/ready (max 180s)
        # Longer timeout than the start-dev smoke (120s) because `start
        # --optimized` doesn't get to skip the realm bootstrap on first boot
        # against a fresh Postgres, and DB migration adds a few seconds.
        #
        # HTTPS + `-k`: Keycloak auto-derives the management-interface
        # protocol from the main listener's TLS config. Once KC_HTTPS_*
        # files are present, both 8443 (main) and 9000 (management) come up
        # as HTTPS using the same cert. The cert is self-signed (CN=localhost,
        # generated in the previous step), so `-k` is needed to skip
        # verification. This mirrors the start-up log:
        #   "Management interface listening on https://0.0.0.0:9000."
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl --silent --fail -k --output /dev/null \
                 --max-time 5 https://localhost:9000/health/ready; then
              echo "Keycloak (optimized) ready after ${i} attempts (~$((i * 2))s)"
              exit 0
            fi
            echo "Attempt ${i}/90: not ready yet, sleeping 2s"
            sleep 2
          done
          echo "::error::Keycloak (optimized) failed to reach /health/ready within 180s"
          echo "----- docker ps -----"
          docker ps -a
          echo "----- container logs (tail 200) -----"
          docker logs --tail 200 kc-opt || true
          exit 1

      - name: Assert no build-time option mismatch warning in logs
        # Belt-and-suspenders on top of the /health/ready check. If the bake
        # is correct, this string never appears. If a future Dockerfile edit
        # removes a needed --build-flag, this grep gives an actionable error
        # message instead of a vague "ready never came" timeout.
        # Match the exact phrase from Keycloak's KcRuntimeConfigSummary log:
        # "build time options have values that differ from what is persisted".
        run: |
          set -euo pipefail
          LOGS="$(docker logs kc-opt 2>&1)"
          if echo "${LOGS}" | grep -q "build time options.*differ"; then
            echo "::error::Optimized startup detected mismatched build-time options."
            echo "::error::The image's kc.sh build flags do not cover all KC_* env vars set at runtime."
            echo "::error::Add the missing flag(s) to the kc.sh build step in the Dockerfile."
            echo "----- matching log lines + context -----"
            echo "${LOGS}" | grep -B 2 -A 5 "build time options.*differ" || true
            exit 1
          fi
          echo "OK: no 'build time options differ' warning in container logs."

      - name: Assert cimd feature is enabled
        # This lives here rather than in smoke-test: only `--optimized`
        # actually runs against the persisted build-time options baked by
        # `kc.sh build --features=cimd` (see Dockerfile stage 2). `start-dev`
        # re-augments on every boot without `--features`, so cimd is off
        # there regardless of what was baked in, and the "features enabled"
        # log line is only printed at augmentation time, never at runtime --
        # neither signal is meaningful in the start-dev job.
        run: |
          set -euo pipefail

          echo "Requesting admin token from master realm"
          TOKEN_JSON="$(
            curl --silent --fail --show-error -k --max-time 10 \
              -X POST https://localhost:8443/realms/master/protocol/openid-connect/token \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -d 'grant_type=password' \
              -d 'client_id=admin-cli' \
              -d 'username=admin' \
              -d 'password=admin'
          )"
          ACCESS_TOKEN="$(echo "${TOKEN_JSON}" | jq -r '.access_token')"
          if [[ -z "${ACCESS_TOKEN}" || "${ACCESS_TOKEN}" == "null" ]]; then
            echo "::error::Failed to obtain admin token. Response:"
            echo "${TOKEN_JSON}"
            exit 1
          fi
          echo "Admin token acquired (length=${#ACCESS_TOKEN})"

          echo "Checking serverinfo for the CIMD feature"
          SERVERINFO_JSON="$(
            curl --silent --fail --show-error -k --max-time 10 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              https://localhost:8443/admin/serverinfo
          )"

          if echo "${SERVERINFO_JSON}" | jq -e '.features[] | select(.name == "CIMD") | .enabled == true' >/dev/null; then
            echo "OK: CIMD feature is enabled:"
            echo "${SERVERINFO_JSON}" | jq '.features[] | select(.name == "CIMD")'
          else
            echo "::error::CIMD feature not enabled in /admin/serverinfo response."
            echo "Full features list:"
            echo "${SERVERINFO_JSON}" | jq '.features' || echo "${SERVERINFO_JSON}"
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "----- docker logs kc-opt -----"
          docker logs kc-opt || true

      - name: Stop and remove container
        if: always()
        run: |
          docker stop kc-opt || true
          docker rm   kc-opt || true

  integration-test:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    # Pull-only on the registry; Failsafe runs against the freshly-pushed
    # image via Testcontainers, which talks to the runner's Docker daemon
    # using whatever credentials the docker/login-action step deposited.
    permissions:
      contents: read
      packages: read

    env:
      # The pom-level Failsafe configuration is expected to read this system
      # property and pass it to Testcontainers' `GenericContainer(...)` ctor.
      # Owned by the other agent's pom.xml + *IT.java changes -- we just
      # surface the value here.
      KC_IMAGE: ${{ needs.build-and-push.outputs.image_ref_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 with Maven cache
        # v5 is a Node 24 runtime bump only; `distribution` / `java-version` /
        # `cache` inputs are unchanged. The `cache: maven` flag wires the
        # built-in cache around ~/.m2 keyed on the workspace's pom.xml hash --
        # it auto-discovers our `src/pom.xml`.
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Log in to GitHub Container Registry (pull)
        # Testcontainers shells out to the host Docker daemon to pull our
        # image. The daemon uses /home/runner/.docker/config.json for auth,
        # which docker/login-action populates. Required even for public
        # packages on rate-limited windows, and necessary if the package
        # later flips to private.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests (Maven verify)
        # Pom lives at src/pom.xml as a single-module project (no parent pom
        # at repo root), so we cd into src/ via `working-directory` rather
        # than try `-pl src` -- the latter would require src/ to be a
        # declared <module> in a parent pom, which it isn't.
        # `-B -ntp` is non-interactive batch + no transfer progress, the
        # standard CI duo. The `image.ref` system property is the agreed
        # handshake with the *IT.java tests: they read it via
        # System.getProperty and feed it into Testcontainers.
        working-directory: src
        run: |
          set -euo pipefail
          echo "Running integration tests against image: ${KC_IMAGE}"
          mvn -B -ntp verify -Dimage.ref="${KC_IMAGE}"

      - name: Upload Failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failsafe-reports
          path: |
            src/target/failsafe-reports/
            src/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  vulnerability-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    # Pull-only on the registry; Trivy scans the freshly-pushed image layers,
    # it doesn't build anything.
    permissions:
      contents: read
      packages: read

    env:
      IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref_sha }}

    steps:
      - name: Checkout repository
        # Needed so .trivyignore (repo root) is present for the scan step below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        # ignore-unfixed: true -- don't fail the build on CVEs with no
        # upstream fix yet; there's nothing actionable to do about those here.
        # exit-code: 1 -- fail the job (and thus gate `release`, via `needs`
        # below) on any HIGH/CRITICAL finding with a fix available.
        # scanners: vuln -- this job is a vuln gate only; exclude the secret
        # scanner (secrets are handled elsewhere, and scanning a published
        # image for secrets is not this job's purpose).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          timeout: 15m
          trivyignores: .trivyignore

  release:
    name: Promote image tag and publish GitHub Release
    runs-on: ubuntu-latest
    # Gate the release entirely on downstream verification. If either smoke,
    # integration, or vulnerability-scan fail, this job is skipped and no
    # human-readable semver tag ever lands in GHCR -- the only artifacts of a
    # failed v* build are the immutable SHA tag, the date tag, and :latest
    # (which we still produce so cache hits keep working for the next retry).
    needs:
      [
        build-and-push,
        smoke-test,
        smoke-test-optimized,
        integration-test,
        vulnerability-scan,
      ]
    # Only run on `v*` tag pushes. On main/dispatch/pull_request this entire
    # job is skipped cleanly.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'

    permissions:
      # contents: write -- required by softprops/action-gh-release to create
      #   the GitHub Release on `v*` tag push.
      # packages: write -- required by `docker buildx imagetools create` to
      #   write the new tag manifest pointer to GHCR.
      contents: write
      packages: write

    env:
      IMAGE_REF_SHA: ${{ needs.build-and-push.outputs.image_ref_sha }}
      RELEASE_VERSION: ${{ needs.build-and-push.outputs.release_version }}
      # Single source of truth for the human-readable release tag. Both the
      # "Guard against tag overwrite" pre-check and the "Promote..." step
      # below read this so we don't construct the ref string in two places
      # (where they could silently drift).
      #
      # NOTE: GitHub Actions does NOT allow ${{ env.X }} references inside an
      # `env:` block declaration -- env values can only be consumed in `run:`
      # scripts, not composed from other env values at declaration time.
      # Constructing from `github.repository_owner` (always available) + the
      # `needs.*` output is the workaround. The literal `ghcr.io/...keycloak-bundled`
      # path is duplicated from workflow-level env intentionally; the alternative
      # would be reconstructing the ref string in each `run:` block.
      TARGET_REF: ghcr.io/${{ github.repository_owner }}/keycloak-bundled:${{ needs.build-and-push.outputs.release_version }}

    steps:
      - name: Log in to GitHub Container Registry
        # Same login pattern as build-and-push: GITHUB_TOKEN, packages:write.
        # imagetools talks to the registry HTTP API; no source checkout is
        # needed because we don't build anything here.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # Required for `docker buildx imagetools`. The default Docker CLI
        # installed on ubuntu-latest already ships buildx, but using the
        # action ensures a known-good buildx version regardless of runner
        # image drift.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Guard against tag overwrite
        # GHCR does not enforce tag immutability natively -- a workflow rerun
        # on a `v*` tag (or `git tag -f` + force-push) would silently re-point
        # the human-readable tag at a different digest. That breaks the
        # "released artifact never changes" invariant downstream consumers
        # rely on. This step turns that footgun into a hard failure: if the
        # target ref already resolves on the registry, abort before the
        # promote step writes anything.
        #
        # `imagetools inspect` exits 0 when the tag exists (== overwrite
        # attempted, must fail) and non-zero on 404 or any other error (==
        # treat as "tag absent, safe to proceed", per the task spec). Note:
        # this conflates 404 with transient registry errors, which is a
        # known limitation -- a flaky inspect would let promotion proceed.
        # The promote step's own server-side write will surface registry
        # errors anyway, so the blast radius is small.
        #
        # `set -euo pipefail` would normally abort on the first non-zero
        # exit, so the inspect is wrapped in `if !` to capture its status
        # without tripping `errexit` -- this is the idiomatic guard pattern.
        run: |
          set -euo pipefail
          echo "Checking whether ${TARGET_REF} already exists on the registry"
          if docker buildx imagetools inspect "${TARGET_REF}" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing image tag: ${TARGET_REF}"
            echo "::error::Released image tags are treated as immutable. To re-release this version, delete the existing image tag manually via the GHCR package UI (and reconsider whether you actually want to re-point a released tag)."
            echo "::error::If reproducibility matters, pin consumers to the immutable date+SHA tag (${IMAGE_REF_SHA}) instead of the human-readable semver tag."
            exit 1
          fi
          echo "OK: ${TARGET_REF} does not yet exist; promotion may proceed."

      - name: Promote immutable SHA tag to release tag
        # `docker buildx imagetools create` is the right tool here:
        #   - It works on manifest lists (our image is multi-arch:
        #     amd64+arm64); plain `docker tag` + `docker push` would
        #     re-tag whatever single-arch variant the runner happened to
        #     pull, breaking arm64 consumers.
        #   - It is server-side only: no layers are downloaded or
        #     re-uploaded. The new tag is a manifest pointer to the same
        #     content hash as the SHA tag. Atomic and ~5 seconds.
        #   - It preserves all attestations (SBOM, provenance) attached
        #     to the source manifest because they reference the manifest
        #     digest, not the tag.
        # Skopeo would also work but pulls in an extra apt install step
        # for no operational benefit on the GitHub-hosted runner.
        run: |
          set -euo pipefail
          echo "Promoting ${IMAGE_REF_SHA} -> ${TARGET_REF}"
          docker buildx imagetools create \
            --tag "${TARGET_REF}" \
            "${IMAGE_REF_SHA}"
          echo "Verifying new tag:"
          docker buildx imagetools inspect "${TARGET_REF}"

      - name: Create GitHub Release
        # v3 is a Node 20 -> Node 24 runtime bump only; the input schema
        # (`generate_release_notes`, `draft`, `prerelease`, `name`, `body`,
        # `files`, `tag_name`, etc.) is identical to v2. Release title
        # defaults to the tag name, which is what we want.
        #
        # `body` is pre-pended to the auto-generated commit changelog when
        # `generate_release_notes: true` is also set -- verified against
        # softprops/action-gh-release v3.0.0 README ("If body is specified,
        # the body will be pre-pended to the automatically generated
        # notes."). Net effect: the Image section below renders FIRST on
        # the release page, followed by the auto-generated "What's
        # Changed" / "Full Changelog" section.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          draft: false
          # We do not yet differentiate prerelease tags (e.g. `v1.0.0-rc1`).
          # When we do, set prerelease conditionally from a shell step that
          # inspects the tag suffix and writes to $GITHUB_OUTPUT.
          prerelease: false
          body: |
            ## Image

            - `ghcr.io/${{ github.repository_owner }}/keycloak-bundled:${{ needs.build-and-push.outputs.release_version }}`
            - `${{ needs.build-and-push.outputs.image_ref_sha }}`
            - `ghcr.io/${{ github.repository_owner }}/keycloak-bundled:latest`

            ```sh
            docker pull ghcr.io/${{ github.repository_owner }}/keycloak-bundled:${{ needs.build-and-push.outputs.release_version }}
            ```

            **Architectures:** linux/amd64, linux/arm64

            **Built from:** Keycloak ${{ needs.build-and-push.outputs.kc_version }} + Herdo's remember-me SPI authenticator (commit ${{ needs.build-and-push.outputs.plugin_git_sha }})

            **Attestations:** SBOM + SLSA provenance attached to the manifest list digest
