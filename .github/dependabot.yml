---
# Keeps CI actions and Maven build dependencies patched. No Docker image is
# auto-bumped: the Keycloak base `FROM` is ARG-interpolated
# (quay.io/keycloak/keycloak:${KC_VERSION}) and must move in lockstep with the
# consuming Keycloak Operator (see CLAUDE.md: "Example consumer: AnkiMCP"),
# and the Maven builder tag is ignored below. The `docker` ecosystem stays
# enabled only so that any new literal `FROM` gets tracked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Builder JDK tracks the Keycloak runtime JDK (21). dependabot-core parses
      # `-eclipse-temurin-<N>` as a version segment (3.9.15-eclipse-temurin-21
      # -> 3.9.15.21), so no `versions`/`update-types` range can pin the JDK
      # suffix while allowing Maven patches. The builder is bumped by hand
      # alongside Keycloak bumps (see CLAUDE.md); it never ships in the
      # runtime image, only the JAR it builds does.
      - dependency-name: "maven"

  - package-ecosystem: maven
    directory: /src
    schedule:
      interval: weekly
    ignore:
      # Keycloak BOM is bumped manually in lockstep with KC_VERSION; see CLAUDE.md.
      - dependency-name: "org.keycloak:*"
